[package]
name = "zeron-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeron-preview.workspace = true
zeron-proto.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
zeron-harness.workspace = true
zeron-computer.workspace = true
zeron-tools.workspace = true
zeron-rpc.workspace = true
zeron-update.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6.4", features = ["getrandom"] }
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
reqwest.workspace = true
ignore.workspace = true
nucleo-matcher.workspace = true

tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
zeron-harness = { workspace = true, features = ["installer-fixture"] }
zip.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
# In-process registry server for the two-engine workspace integration tests.
zeron-sync = { workspace = true, features = ["mock-server"] }
