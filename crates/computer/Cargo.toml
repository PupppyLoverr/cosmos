[package]
name = "zeron-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zeron-proto.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net", "time", "sync", "fs", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["codec"] }
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
reqwest.workspace = true
url = "2"
base64 = "0.22"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
