[package]
name = "zeron"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cosmos"

[[bin]]
name = "cosmos"
path = "src/main.rs"

[[bin]]
name = "zeron"
path = "src/main.rs"

[dependencies]
zeron-engine.workspace = true
zeron-computer.workspace = true
zeron-tools.workspace = true
zeron-rpc.workspace = true
zeron-ui.workspace = true
zeron-update.workspace = true
zeron-mcp.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is mimalloc v2 on macOS (libmalloc watermark) and
# Windows (NT heap high-water). Linux stays on glibc, which measured flat.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
