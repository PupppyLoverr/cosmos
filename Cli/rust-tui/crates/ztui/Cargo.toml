[package]
name = "ztui"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Same building blocks as Devin CLI where they matter: crossterm for the
# terminal, pulldown-cmark for markdown, tree-sitter-highlight for code,
# nucleo for fuzzy menus, similar for diffs. ratatui is used only for its
# styled-text types; painting is our own inline renderer (term.rs).
[dependencies]
anyhow = "1"
serde_json = "1"
zproto = { path = "../zproto" }
zcore = { path = "../zcore" }
ztools = { path = "../ztools" }
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2"
pulldown-cmark = { version = "0.12", default-features = false }
nucleo-matcher = "0.3"
similar = "2.7"
cpal = "0.18"
ignore = "0.4"
base64 = "0.22"
zproviders = { path = "../zproviders" }
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"

[dev-dependencies]
tempfile = "3"
alacritty_terminal = "0.26"
