[package]
name = "ztui"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Same building blocks as Devin CLI where they matter: crossterm for the
# terminal, pulldown-cmark for markdown, tree-sitter-highlight for code,
# nucleo for fuzzy menus, similar for diffs. tree-sitter is opt-in
# (`highlight` feature) to keep the default binary small. ratatui is used only for its
# styled-text types; painting is our own inline renderer (term.rs).
[dependencies]
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
zproto = { path = "../zproto" }
zcore = { path = "../zcore" }
ztools = { path = "../ztools" }
ratatui-core = "0.1.2"
crossterm = "0.29.0"
unicode-width = "0.2"
pulldown-cmark = { version = "0.12", default-features = false }
nucleo-matcher = "0.3"
similar = "2.7"
cpal = { version = "0.18", optional = true }
ignore = "0.4"
base64 = "0.22"
zproviders = { path = "../zproviders" }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-highlight = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }

[features]
# Microphone dictation (cpal). On by default; costs ~0.4 MB.
default = ["voice"]
voice = ["dep:cpal"]
# tree-sitter grammars for fenced code (~10 MB). Off by default — the
# built-in lexer in highlight.rs colours code without them.
highlight = [
    "dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-rust",
    "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript",
    "dep:tree-sitter-go", "dep:tree-sitter-bash", "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng", "dep:tree-sitter-yaml", "dep:tree-sitter-c",
    "dep:tree-sitter-cpp", "dep:tree-sitter-css", "dep:tree-sitter-html",
]

[dev-dependencies]
tempfile = "3"
alacritty_terminal = "0.26"
