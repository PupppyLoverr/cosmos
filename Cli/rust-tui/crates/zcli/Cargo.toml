[package]
name = "cosmostui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde_json = "1"
zproto = { path = "../zproto" }
zcore = { path = "../zcore" }
ztools = { path = "../ztools" }
ztui = { path = "../ztui", default-features = false }
crossterm = "0.29.0"

[features]
default = ["voice"]
voice = ["ztui/voice"]
highlight = ["ztui/highlight"]

[[bin]]
name = "cosmostui"
path = "src/main.rs"
