[package]
name = "ztools"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
ignore = "0.4"
globset = "0.4"
ureq = { version = "3", features = ["json"] }
zproto = { path = "../zproto" }
zproviders = { path = "../zproviders" }
zsandbox = { path = "../zsandbox" }

[lib]
name = "ztools"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
