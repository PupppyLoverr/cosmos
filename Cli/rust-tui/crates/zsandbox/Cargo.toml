[package]
name = "zsandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cosmos CLI sandbox: AppContainer + Job object exec for model-spawned commands"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_Storage_FileSystem",
] }

[lib]
name = "zsandbox"
path = "src/lib.rs"

[[bin]]
name = "zsandbox"
path = "src/main.rs"
