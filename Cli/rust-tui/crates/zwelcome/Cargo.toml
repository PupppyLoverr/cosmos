[package]
name = "zwelcome"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The one-shot first-run flow. Built as its own executable so cosmostui can delete
# it once onboarding completes — none of this ships in the daily binary.
[dependencies]
anyhow = "1"
zcore = { path = "../zcore" }
ztui = { path = "../ztui" }
ratatui = "0.30.2"
crossterm = "0.29.0"
cpal = "0.18"
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cosmostui-welcome"
path = "src/main.rs"
