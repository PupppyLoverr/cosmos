[package]
name = "meridian_bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ulid = "1"
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", features = ["std", "clock"], default-features = false }
base64 = "0.22"

[[bin]]
name = "meridian"
path = "src/main.rs"

[lib]
name = "meridian_bridge"
path = "src/lib.rs"
